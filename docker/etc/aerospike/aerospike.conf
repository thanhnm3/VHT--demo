# ==================== service ====================
service {
	cluster-name docker
    user root
    group root

    # Số luồng service tốt nhất = 3 × vCPU (nếu 2 vCPU thì đặt 6)
    service-threads 6
    proto-fd-max 50000
}

# ==================== logging ====================
logging {
    console {
        context any info
    }
}

# ==================== network ====================
network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        mesh-seed-address-port 172.28.0.2 3002
        mesh-seed-address-port 172.28.0.3 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
    info {
        address any
        port 3003
    }
}

# ==================== namespace producer ====================
namespace producer {
    replication-factor 2
    default-ttl 0

    # Giới hạn bộ nhớ cao gây stop-writes nếu dùng thiếu bộ nhớ
    stop-writes-sys-memory-pct 90
    evict-indexes-memory-pct 20

    storage-engine device {
        file /opt/aerospike/data/producer.dat
        filesize 4G

        # Thiết lập flush và cache Cao cấp tương thích 7.1+
        flush-size 128K
        max-write-cache 64M
        # Không dùng post-write-cache (tránh lỗi "unsigned number")
        # Không dùng use-direct-io (chỉ dành cho raw device)
        
        defrag-lwm-pct 50
        evict-used-pct 90
    }
}
