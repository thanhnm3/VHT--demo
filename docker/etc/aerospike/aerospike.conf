# ==================== service ====================
service {
	cluster-name docker
    user root
    group root

    # Số luồng service tốt nhất = 3 × vCPU (nếu 2 vCPU thì đặt 6)
    service-threads 6
    proto-fd-max 50000
}

# ==================== logging ====================
logging {
    console {
        context any info
    }
}

# ==================== network ====================
network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
    info {
        address any
        port 3003
    }
}

# ==================== namespace producer ====================
namespace producer {
    replication-factor 1
    default-ttl 0
    storage-engine device {
        file /opt/aerospike/data/producer.dat
        filesize 45G
        flush-size 256K
        max-write-cache 256M
        defrag-lwm-pct 30
    }
}
