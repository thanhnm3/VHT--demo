# Aerospike database configuration file
# Node replica trong cluster
service {
	cluster-name docker
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address any
		port 3002
		interval 150
		timeout 10
        mesh-seed-address-port 172.28.0.2 3002
	}

	fabric {
		address any
		port 3001
	}
}

namespace producer {
	replication-factor 2
	default-ttl 0
	nsup-period 120
	storage-engine device {
		file /opt/aerospike/data/producer.dat
		filesize 4G
		read-page-cache true
	}
} 